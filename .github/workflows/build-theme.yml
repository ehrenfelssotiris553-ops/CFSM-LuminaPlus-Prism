name: Build theme

# 源码在 main，构建产物（index.html + assets/）自动发布到 dist 分支。
# 主题安装地址就填 dist 分支：
#   https://github.com/<owner>/<repo>/tree/dist
#
# preview 分支同理，产物发到 dist-preview，用来在后台临时切地址验收，
# 不会动到线上用的 dist。
#
# 产物提交的说明格式是
#   v<package.json 的 version> <触发本次构建的源码提交标题>
# 后端主题规范要求产物提交保留源码的 commit 说明；手动触发时取当时 HEAD 的提交标题，
# 也可以在 changelog 里另写一句。CHANGELOG.md 只用于下面发 GitHub Release 的正文。
#
# 纯静态部署（GitHub Pages）：在仓库 Settings → Secrets and variables → Actions 里配置 API_BASE
# （选填 TITLE、BACKGROUND_IMAGE、CSP_API、CSP_STATIC），构建时会把它们写进 index.html，
# 地址不进仓库文件。不配置 API_BASE 就是普通构建，供 Workers 后台用 tree/dist 加载。
# 用 Pages 托管时还要在 Settings → Pages 选 dist 分支作为来源，并在每个 Worker 的
# CORS_ALLOWED_ORIGINS 里加上 Pages 域名。
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      changelog:
        description: "产物提交说明（留空则用 HEAD 源码提交的标题）"
        required: false
        type: string
      force:
        description: "产物没变化也发布一版（只想改更新日志时用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 连续推送时只保留最后一次构建，避免两个 job 抢着往同一个分支推。
# main 与 preview 各自排队，互不打断。
concurrency:
  group: build-theme-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target branch
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "preview" ]; then
            echo "branch=dist-preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=dist" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 版本号来自 package.json，发布新版本前记得 npm version / 手改一下。
      - name: Compose release note
        id: note
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          # 优先级：手动填的说明 > 触发本次构建的源码提交标题（后端主题规范：保留源码 commit 说明）。
          note="${CHANGELOG:-}"
          [ -n "${note}" ] || note="$(git log -1 --pretty=%s)"
          {
            echo "message<<RELEASE_NOTE_EOF"
            echo "${version} ${note}"
            echo
            echo "build: ${GITHUB_SHA::7}"
            echo "RELEASE_NOTE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次产物说明：${version} ${note}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 运行时配置只从仓库 Secrets 注入，不写进仓库文件；没配 API_BASE 就是 Workers 用的普通构建。
      - name: Build
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          CSP_API: ${{ secrets.CSP_API }}
          CSP_STATIC: ${{ secrets.CSP_STATIC }}
        run: |
          if [ -n "${API_BASE}" ]; then
            npm run build:github-page
          else
            npm run build
          fi

      # 主题目录只允许 index.html 和 assets/，构建配置若被改坏要在这里拦下来。
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          test -d dist/assets || { echo "缺少 dist/assets/"; exit 1; }
          unexpected="$(find dist -mindepth 1 -maxdepth 1 ! -name index.html ! -name assets)"
          if [ -n "$unexpected" ]; then
            echo "产物里出现了不允许的顶层文件："
            echo "$unexpected"
            exit 1
          fi

      # 产物分支必须保留历史：主题商店的 versions[].commitid 指向某次构建的 commit，
      # 用户也可能把主题地址锁在 40 位 SHA 上。一旦 force-push 覆盖，这些旧地址就会失效，
      # 所以这里是在已有分支上追加提交，不重建、不强推。
      - name: Publish build
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          RELEASE_NOTE: ${{ steps.note.outputs.message }}
          FORCE_PUBLISH: ${{ inputs.force }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="${RUNNER_TEMP}/publish"

          # 已有产物分支就克隆下来接着提交；第一次发布时该分支还不存在。
          if ! git clone -q --branch "${TARGET_BRANCH}" --single-branch "${remote}" "${workdir}"; then
            echo "${TARGET_BRANCH} 还不存在，创建新分支"
            git init -q -b "${TARGET_BRANCH}" "${workdir}"
            git -C "${workdir}" remote add origin "${remote}"
          fi

          # 换成本次产物：删掉除 .git 外的所有旧文件，再整包拷入。
          find "${workdir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. "${workdir}/"
          # 再把前几版还可能被用到的 assets 放回去：后端按 tree/dist 加载主题时会把 index.html 缓存 1 小时，
          # 这段时间里访客拿到的还是旧 index.html，它会去要旧版本的分包（设置页、详情页等），删了就打不开。
          # 本次产物和上一版完全一样时脚本输出 same。
          state="$(node scripts/retain-assets.mjs "${workdir}" dist)"

          cd "${workdir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 只想给商店补一条更新日志时（force），用同样的产物再发一版。
          if [ "${state}" = "same" ] && [ "${FORCE_PUBLISH}" != "true" ]; then
            echo "产物与上次一致，跳过发布：$(git rev-parse HEAD)"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q --allow-empty -m "${RELEASE_NOTE}"
          git push -q origin "HEAD:${TARGET_BRANCH}"
          echo "已发布到 ${TARGET_BRANCH} 分支：${GITHUB_SHA::7}"
          echo "产物 commit（可用于主题商店 versions[].commitid）：$(git rev-parse HEAD)"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 正式版（dist）发一条 GitHub Release，方便别人 Watch → Releases 订阅更新（issue #6 有人要）。
      # 标签打在产物提交上，所以 tree/v<版本号> 就是那一版的主题文件。
      # 标题只写版本号（站长 2026-10-15：仓库首页右侧 Releases 栏带上更新日志会被截断），更新日志第一行放进正文开头。
      # 同一版本号的标签已经在了就跳过（同一版本号推两次 main 时不会覆盖已发的 Release）。
      # 只是通知，不影响任何人的主题怎么更新；这一步失败也不影响上面已经发布好的产物。
      - name: Create GitHub Release
        if: steps.target.outputs.branch == 'dist' && steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "标签 ${version} 已存在，不再发 Release"
            exit 0
          fi
          title="$(awk -v want="## ${version}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found && NF { print; exit }
          ' CHANGELOG.md)"
          notes="${RUNNER_TEMP}/release-notes.md"
          # 正文只列这一版每条的加粗标题（带上 issue 号），细节留在 CHANGELOG（站长 2026-10-15：整段贴进来太长）。
          brief="$(awk -v want="## ${version}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found && /^- \*\*/ {
              line = $0
              sub(/^- \*\*/, "", line)
              end = index(line, "**")
              if (end == 0) next
              head = substr(line, 1, end - 1)
              rest = substr(line, end + 2)
              ref = ""
              if (index(rest, "（") == 1) {
                close_at = index(rest, "）")
                paren = close_at > 0 ? substr(rest, 1, close_at) : ""
                if (match(paren, /#[0-9]+/)) ref = "（" substr(paren, RSTART, RLENGTH) "）"
              }
              print "- " head ref
            }
          ' CHANGELOG.md)"
          {
            if [ -n "${title:-}" ]; then
              echo "${title}"
              echo
            fi
            if [ -n "${brief}" ]; then
              echo "${brief}"
              echo
            fi
            echo "完整说明见 [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
            echo
            echo "锁定这一版的主题地址：\`https://github.com/${GITHUB_REPOSITORY}/tree/${DIST_COMMIT}\`"
          } > "${notes}"
          gh release create "${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${DIST_COMMIT}" \
            --title "${version}" \
            --notes-file "${notes}"
          echo "已发 Release ${version}（标签指向产物 ${DIST_COMMIT::7}）"
